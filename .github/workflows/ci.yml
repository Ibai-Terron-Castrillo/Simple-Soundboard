name: Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore LocalSoundboard.sln
      - run: dotnet build LocalSoundboard.sln --configuration Release --no-restore
      - run: dotnet test LocalSoundboard.Tests/LocalSoundboard.Tests.csproj --configuration Release --no-build --verbosity minimal
